
spring.application.name=colheitasmart-api
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
spring.profiles.default=oracle
spring.jackson.deserialization.fail-on-unknown-properties=true
# Front-End autorizado
app.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://colheita-smart.vercel.app}
# Sessao e cookies
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
