services:
  - type: web
    name: colheitasmart-api
    runtime: docker
    healthCheckPath: /status
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: oracle
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
